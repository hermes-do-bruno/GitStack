name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: git-stack-linux-x64
          - goos: linux
            goarch: arm64
            artifact_name: git-stack-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact_name: git-stack-macos-x64
          - goos: darwin
            goarch: arm64
            artifact_name: git-stack-macos-arm64
    env:
      CGO_ENABLED: 0
      GOFLAGS: -trimpath
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=${VERSION} make release-build
          tar -czf dist/${{ matrix.artifact_name }}.tar.gz -C dist git-stack
          sha256sum dist/${{ matrix.artifact_name }}.tar.gz > dist/${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256
